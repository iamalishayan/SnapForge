services:
  - name: snapforge-worker
    type: web
    docker:
      dockerfile: packages/queue/Dockerfile
    ports:
      - port: 3005
        protocol: http
    scalings:
      - min: 1
        max: 1
    env:
      - key: NODE_ENV
        value: production
      - key: BULL_BOARD_PORT
        value: "3005"
    regions:
      - fra
