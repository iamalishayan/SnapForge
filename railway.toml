# Railway — SnapForge BullMQ worker
# Deploy from monorepo root with Dockerfile at packages/queue/Dockerfile
# Pause this service when idle to stay within free/trial credits.

[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/queue/Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
