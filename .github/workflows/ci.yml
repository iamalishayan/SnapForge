name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    
    # Provide a real Redis instance to prevent ECONNREFUSED during Next.js static generation
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    # Define environment variables needed for tests and builds
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-key
      ADMIN_API_KEY: test-fallback-key
      UPSTASH_REDIS_URL: redis://default:dummy@127.0.0.1:6379
      UPSTASH_REDIS_REST_URL: https://127.0.0.1
      UPSTASH_REDIS_REST_TOKEN: dummy
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Type Checking
        run: pnpm type-check

      - name: Run Linting
        run: pnpm lint

      - name: Run Unit & Integration Tests
        run: pnpm test

      - name: Build Applications
        run: pnpm build
